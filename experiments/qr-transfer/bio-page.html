<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Links, projects, and ways to find me online.">
  <title>Ryan on the web</title>
  <style>
    :root { --bg:#f4d35e; --ink:#111; --card:#fff; --accent:#ee4266; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font:18px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    main { width:min(560px,100%); }
    header { text-align:center; margin-bottom:28px; }
    .avatar { width:112px; aspect-ratio:1; display:grid; place-items:center; margin:auto; border:4px solid; border-radius:50%; background:var(--accent); color:white; font-size:42px; font-weight:900; box-shadow:6px 6px 0 var(--ink); }
    h1 { margin:20px 0 4px; font-size:clamp(2rem,9vw,4rem); line-height:1; }
    .bio { margin:0 auto; max-width:40ch; }
    nav { display:grid; gap:14px; }
    nav a { display:block; padding:16px 20px; border:3px solid; background:var(--card); color:inherit; font-weight:800; text-decoration:none; box-shadow:5px 5px 0 var(--ink); transition:120ms; }
    nav a:hover, nav a:focus-visible { translate:3px 3px; box-shadow:2px 2px 0 var(--ink); background:#fff8d6; }
    footer { margin-top:28px; text-align:center; font-size:.9rem; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="avatar" aria-hidden="true">RM</div>
      <h1>Ryan McGovern</h1>
      <p class="bio">I build small tools, organize community events, and make things for the weird, personal web.</p>
    </header>
    <nav aria-label="Find me online">
      <a href="https://example.com">🌐 My website</a>
      <a href="https://example.com/projects">🛠️ Things I've built</a>
      <a href="https://example.com/events">☕ Local events</a>
      <a href="https://github.com/tekgadgt">💻 GitHub</a>
      <a href="mailto:hello@example.com">✉️ Say hello</a>
    </nav>
    <footer>Made with one HTML file.</footer>
  </main>
</body>
</html>
